name: CI

"on":
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Compatibility tests on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run compatibility tests
        run: npm test
